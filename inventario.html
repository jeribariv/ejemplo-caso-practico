<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Ventas - Gestión de Inventario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><span class="navbar-brand mb-0">Sistema de Ventas - Gestión de Inventario</span></div>
</nav>
<div class="container my-4">
  <div id="mensajes"></div>

  <!-- Búsqueda -->
  <div class="card shadow-sm mb-4"><div class="card-body">
    <div class="input-group">
      <span class="input-group-text">Buscar por producto:</span>
      <input id="txtBuscar" class="form-control" type="text">
      <button class="btn btn-primary" onclick="buscar()">Buscar</button>
    </div>
  </div></div>

  <!-- Formulario -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3"><div class="col-md-6"><label for="id_producto" class="form-label fw-semibold">Producto:</label><select id="id_producto" class="form-select"><option value="">Seleccione...</option><option>Laptop HP 15</option><option>Mouse Logitech</option><option>Teclado Redragon</option></select></div><div class="col-md-6"><label for="stock_maximo" class="form-label fw-semibold">Stock máximo:</label><input id="stock_maximo" type="number" class="form-control" min="0" step="1"></div><div class="col-md-6"><label for="stock_actual" class="form-label fw-semibold">Stock actual:</label><input id="stock_actual" type="number" class="form-control" min="0" step="1"></div><div class="col-md-6"><label for="fecha_actualizacion" class="form-label fw-semibold">Fecha de actualización:</label><input id="fecha_actualizacion" class="form-control bg-light" readonly></div><div class="col-md-6"><label for="stock_minimo" class="form-label fw-semibold">Stock mínimo:</label><input id="stock_minimo" type="number" class="form-control" min="0" step="1"></div><div class="col-md-6"><label for="ubicacion_almacen" class="form-label fw-semibold">Ubicación en almacén:</label><input id="ubicacion_almacen" type="text" class="form-control"></div></div>
      <div class="mt-4 d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" onclick="registrar()">Registrar</button>
        <button class="btn btn-primary" onclick="modificar()">Modificar</button>
        <button class="btn btn-danger" onclick="eliminar()">Eliminar</button>
        <button class="btn btn-secondary" onclick="limpiar()">Limpiar</button>
      </div>
    </div>
  </div>

  <!-- Tabla de registros -->
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark"><tr><th>Producto</th><th>Stock actual</th><th>Stock mínimo</th><th>Stock máximo</th><th>Actualización</th><th>Ubicación</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CAMPOS = [{"k": "id_producto", "l": "Producto", "t": "select", "r": true}, {"k": "stock_maximo", "l": "Stock máximo", "t": "number", "r": true}, {"k": "stock_actual", "l": "Stock actual", "t": "number", "r": true}, {"k": "fecha_actualizacion", "l": "Fecha de actualización", "t": "fijo", "r": false, "d": "HOY", "h": true}, {"k": "stock_minimo", "l": "Stock mínimo", "t": "number", "r": true}, {"k": "ubicacion_almacen", "l": "Ubicación en almacén", "t": "text", "r": true}];
const COLUMNAS = [{"k": "id_producto", "l": "Producto"}, {"k": "stock_actual", "l": "Stock actual"}, {"k": "stock_minimo", "l": "Stock mínimo"}, {"k": "stock_maximo", "l": "Stock máximo"}, {"k": "fecha_actualizacion", "l": "Actualización"}, {"k": "ubicacion_almacen", "l": "Ubicación"}];
const AUTO = null;
let datos = [{"id_producto": "Laptop HP 15", "stock_actual": 10, "stock_minimo": 3, "stock_maximo": 30, "fecha_actualizacion": "2026-10-12", "ubicacion_almacen": "Pasillo A - Estante 1", "_id": 1}, {"id_producto": "Mouse Logitech", "stock_actual": 50, "stock_minimo": 10, "stock_maximo": 100, "fecha_actualizacion": "2026-10-12", "ubicacion_almacen": "Pasillo B - Estante 2", "_id": 2}, {"id_producto": "Teclado Redragon", "stock_actual": 0, "stock_minimo": 5, "stock_maximo": 40, "fecha_actualizacion": "2026-10-11", "ubicacion_almacen": "Pasillo B - Estante 3", "_id": 3}];
let seleccionado = null;
let vista = datos;
let siguiente = datos.reduce((m, d) => Math.max(m, d._id), 0) + 1;

const $ = id => document.getElementById(id);
const hoy = () => new Date().toISOString().slice(0, 10);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function calcular(){}
function validarExtra(d){
  if (Number(d.stock_minimo) > Number(d.stock_maximo)) return 'El stock mínimo no puede ser mayor que el máximo.';
  return '';
}

function mensaje(texto, tipo) {
  $('mensajes').innerHTML =
    '<div class="alert alert-' + tipo + ' alert-dismissible fade show" role="alert">' + esc(texto) +
    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
}

function valorInicial(c) {
  if (c.t === 'auto') return 'Automático';
  if (c.d === 'HOY') return hoy();
  return c.d !== undefined ? c.d : '';
}

function pintarTabla(lista) {
  vista = lista;
  const tb = $('tbody');
  if (lista.length === 0) {
    tb.innerHTML = '<tr><td colspan="' + COLUMNAS.length + '" class="text-center text-muted">No se encontraron registros</td></tr>';
    return;
  }
  tb.innerHTML = lista.map(d =>
    '<tr style="cursor:pointer" class="' + (d._id === seleccionado ? 'table-primary' : '') + '" onclick="cargar(' + d._id + ')">' +
    COLUMNAS.map(c => '<td>' + esc(d[c.k] === undefined ? '' : d[c.k]) + '</td>').join('') + '</tr>'
  ).join('');
}

function limpiar() {
  seleccionado = null;
  CAMPOS.forEach(c => { $(c.k).value = valorInicial(c); });
  $('txtBuscar').value = '';
  calcular();
  pintarTabla(datos);
}

function leerFormulario() {
  const d = {};
  CAMPOS.forEach(c => { if (c.t !== 'auto') d[c.k] = $(c.k).value.trim(); });
  CAMPOS.filter(c => c.h).forEach(c => { d[c.k] = hoy(); });
  return d;
}

function validar(d) {
  for (const c of CAMPOS) {
    if (c.t === 'auto' || !c.r) continue;
    if (d[c.k] === '') return 'Complete el campo "' + c.l + '".';
    if (c.p && !new RegExp(c.p).test(d[c.k])) return c.m;
    if (c.t === 'number' && Number(d[c.k]) < 0) return 'El campo "' + c.l + '" no puede ser negativo.';
  }
  return validarExtra(d);
}

function registrar() {
  const d = leerFormulario();
  const error = validar(d);
  if (error) { mensaje(error, 'danger'); return; }
  d._id = siguiente++;
  if (AUTO) d[AUTO] = d._id;
  datos.push(d);
  limpiar();
  mensaje('Registro agregado correctamente.', 'success');
}

function modificar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  const d = leerFormulario();
  const error = validar(d);
  if (error) { mensaje(error, 'danger'); return; }
  d._id = seleccionado;
  if (AUTO) d[AUTO] = seleccionado;
  datos = datos.map(x => x._id === seleccionado ? d : x);
  limpiar();
  mensaje('Registro modificado correctamente.', 'success');
}

function eliminar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  if (!confirm('¿Seguro que desea eliminar este registro?')) return;
  datos = datos.filter(x => x._id !== seleccionado);
  limpiar();
  mensaje('Registro eliminado correctamente.', 'success');
}

function buscar() {
  const t = $('txtBuscar').value.trim().toLowerCase();
  const res = datos.filter(d => COLUMNAS.some(c => String(d[c.k] === undefined ? '' : d[c.k]).toLowerCase().includes(t)));
  pintarTabla(res);
  if (res.length === 0) mensaje('No se encontraron resultados.', 'info');
}

function cargar(id) {
  const d = datos.find(x => x._id === id);
  if (!d) return;
  seleccionado = id;
  CAMPOS.forEach(c => {
    $(c.k).value = c.t === 'auto' ? d._id : (d[c.k] === undefined ? '' : d[c.k]);
  });
  calcular();
  pintarTabla(vista);
}

document.addEventListener('DOMContentLoaded', () => {
  CAMPOS.forEach(c => {
    $(c.k).addEventListener('input', calcular);
    $(c.k).addEventListener('change', calcular);
  });
  $('txtBuscar').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
  limpiar();
});
</script>
</body>
</html>
