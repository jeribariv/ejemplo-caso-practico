<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Ventas - Gestión de Detalles</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><span class="navbar-brand mb-0">Sistema de Ventas - Gestión de Detalles</span></div>
</nav>
<div class="container my-4">
  <div id="mensajes"></div>

  <!-- Búsqueda -->
  <div class="card shadow-sm mb-4"><div class="card-body">
    <div class="input-group">
      <span class="input-group-text">Buscar por ID de venta:</span>
      <input id="txtBuscar" class="form-control" type="text">
      <button class="btn btn-primary" onclick="buscar()">Buscar</button>
    </div>
  </div></div>

  <!-- Formulario -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3"><div class="col-md-6"><label for="id_detalle" class="form-label fw-semibold">ID Detalle:</label><input id="id_detalle" class="form-control bg-light" readonly></div><div class="col-md-6"><label for="cantidad" class="form-label fw-semibold">Cantidad:</label><input id="cantidad" type="number" class="form-control" min="0" step="1"></div><div class="col-md-6"><label for="id_venta" class="form-label fw-semibold">Venta:</label><select id="id_venta" class="form-select"><option value="">Seleccione...</option><option>1</option><option>2</option><option>3</option></select></div><div class="col-md-6"><label for="precio_unitario" class="form-label fw-semibold">Precio unitario:</label><input id="precio_unitario" class="form-control bg-light" readonly></div><div class="col-md-6"><label for="id_producto" class="form-label fw-semibold">Producto:</label><select id="id_producto" class="form-select"><option value="">Seleccione...</option><option>Laptop HP 15</option><option>Mouse Logitech</option><option>Teclado Redragon</option></select></div><div class="col-md-6"><label for="descuento" class="form-label fw-semibold">Descuento:</label><input id="descuento" type="number" class="form-control" min="0" step="0.01"></div><div class="col-md-6"><label for="total_item" class="form-label fw-semibold">Total ítem:</label><input id="total_item" class="form-control bg-light" readonly></div></div>
      <div class="mt-4 d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" onclick="registrar()">Registrar</button>
        <button class="btn btn-primary" onclick="modificar()">Modificar</button>
        <button class="btn btn-danger" onclick="eliminar()">Eliminar</button>
        <button class="btn btn-secondary" onclick="limpiar()">Limpiar</button>
      </div>
    </div>
  </div>

  <!-- Tabla de registros -->
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark"><tr><th>ID</th><th>Venta</th><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Descuento</th><th>Total ítem</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CAMPOS = [{"k": "id_detalle", "l": "ID Detalle", "t": "auto", "r": false}, {"k": "cantidad", "l": "Cantidad", "t": "number", "r": true}, {"k": "id_venta", "l": "Venta", "t": "select", "r": true}, {"k": "precio_unitario", "l": "Precio unitario", "t": "calc", "r": false}, {"k": "id_producto", "l": "Producto", "t": "select", "r": true}, {"k": "descuento", "l": "Descuento", "t": "number", "r": true, "d": "0"}, {"k": "total_item", "l": "Total ítem", "t": "calc", "r": false}];
const COLUMNAS = [{"k": "id_detalle", "l": "ID"}, {"k": "id_venta", "l": "Venta"}, {"k": "id_producto", "l": "Producto"}, {"k": "cantidad", "l": "Cantidad"}, {"k": "precio_unitario", "l": "Precio unitario"}, {"k": "descuento", "l": "Descuento"}, {"k": "total_item", "l": "Total ítem"}];
const AUTO = "id_detalle";
let datos = [{"id_detalle": 1, "id_venta": "1", "id_producto": "Mouse Logitech", "cantidad": 2, "precio_unitario": "45.00", "descuento": "0.00", "total_item": "90.00", "_id": 1}, {"id_detalle": 2, "id_venta": "1", "id_producto": "Teclado Redragon", "cantidad": 1, "precio_unitario": "120.00", "descuento": "10.00", "total_item": "110.00", "_id": 2}, {"id_detalle": 3, "id_venta": "2", "id_producto": "Laptop HP 15", "cantidad": 1, "precio_unitario": "2500.00", "descuento": "0.00", "total_item": "2500.00", "_id": 3}];
let seleccionado = null;
let vista = datos;
let siguiente = datos.reduce((m, d) => Math.max(m, d._id), 0) + 1;

const $ = id => document.getElementById(id);
const hoy = () => new Date().toISOString().slice(0, 10);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PRECIOS = {"Laptop HP 15": 2500, "Mouse Logitech": 45, "Teclado Redragon": 120};
function calcular(){
  const p = PRECIOS[$('id_producto').value] || 0;
  const c = parseFloat($('cantidad').value) || 0;
  const ds = parseFloat($('descuento').value) || 0;
  $('precio_unitario').value = p.toFixed(2);
  $('total_item').value = Math.max(c * p - ds, 0).toFixed(2);
}
function validarExtra(d){
  if (Number(d.cantidad) <= 0) return 'La cantidad debe ser mayor a 0.';
  return '';
}

function mensaje(texto, tipo) {
  $('mensajes').innerHTML =
    '<div class="alert alert-' + tipo + ' alert-dismissible fade show" role="alert">' + esc(texto) +
    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
}

function valorInicial(c) {
  if (c.t === 'auto') return 'Automático';
  if (c.d === 'HOY') return hoy();
  return c.d !== undefined ? c.d : '';
}

function pintarTabla(lista) {
  vista = lista;
  const tb = $('tbody');
  if (lista.length === 0) {
    tb.innerHTML = '<tr><td colspan="' + COLUMNAS.length + '" class="text-center text-muted">No se encontraron registros</td></tr>';
    return;
  }
  tb.innerHTML = lista.map(d =>
    '<tr style="cursor:pointer" class="' + (d._id === seleccionado ? 'table-primary' : '') + '" onclick="cargar(' + d._id + ')">' +
    COLUMNAS.map(c => '<td>' + esc(d[c.k] === undefined ? '' : d[c.k]) + '</td>').join('') + '</tr>'
  ).join('');
}

function limpiar() {
  seleccionado = null;
  CAMPOS.forEach(c => { $(c.k).value = valorInicial(c); });
  $('txtBuscar').value = '';
  calcular();
  pintarTabla(datos);
}

function leerFormulario() {
  const d = {};
  CAMPOS.forEach(c => { if (c.t !== 'auto') d[c.k] = $(c.k).value.trim(); });
  CAMPOS.filter(c => c.h).forEach(c => { d[c.k] = hoy(); });
  return d;
}

function validar(d) {
  for (const c of CAMPOS) {
    if (c.t === 'auto' || !c.r) continue;
    if (d[c.k] === '') return 'Complete el campo "' + c.l + '".';
    if (c.p && !new RegExp(c.p).test(d[c.k])) return c.m;
    if (c.t === 'number' && Number(d[c.k]) < 0) return 'El campo "' + c.l + '" no puede ser negativo.';
  }
  return validarExtra(d);
}

function registrar() {
  const d = leerFormulario();
  const error = validar(d);
  if (error) { mensaje(error, 'danger'); return; }
  d._id = siguiente++;
  if (AUTO) d[AUTO] = d._id;
  datos.push(d);
  limpiar();
  mensaje('Registro agregado correctamente.', 'success');
}

function modificar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  const d = leerFormulario();
  const error = validar(d);
  if (error) { mensaje(error, 'danger'); return; }
  d._id = seleccionado;
  if (AUTO) d[AUTO] = seleccionado;
  datos = datos.map(x => x._id === seleccionado ? d : x);
  limpiar();
  mensaje('Registro modificado correctamente.', 'success');
}

function eliminar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  if (!confirm('¿Seguro que desea eliminar este registro?')) return;
  datos = datos.filter(x => x._id !== seleccionado);
  limpiar();
  mensaje('Registro eliminado correctamente.', 'success');
}

function buscar() {
  const t = $('txtBuscar').value.trim().toLowerCase();
  const res = datos.filter(d => COLUMNAS.some(c => String(d[c.k] === undefined ? '' : d[c.k]).toLowerCase().includes(t)));
  pintarTabla(res);
  if (res.length === 0) mensaje('No se encontraron resultados.', 'info');
}

function cargar(id) {
  const d = datos.find(x => x._id === id);
  if (!d) return;
  seleccionado = id;
  CAMPOS.forEach(c => {
    $(c.k).value = c.t === 'auto' ? d._id : (d[c.k] === undefined ? '' : d[c.k]);
  });
  calcular();
  pintarTabla(vista);
}

document.addEventListener('DOMContentLoaded', () => {
  CAMPOS.forEach(c => {
    $(c.k).addEventListener('input', calcular);
    $(c.k).addEventListener('change', calcular);
  });
  $('txtBuscar').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
  limpiar();
});
</script>
</body>
</html>
