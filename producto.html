<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Ventas - Gestión de Producto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><span class="navbar-brand mb-0">Sistema de Ventas - Gestión de Producto</span></div>
</nav>
<div class="container my-4">
  <div id="mensajes"></div>

  <!-- Búsqueda -->
  <div class="card shadow-sm mb-4"><div class="card-body">
    <div class="input-group">
      <span class="input-group-text">Buscar por nombre o categoría:</span>
      <input id="txtBuscar" class="form-control" type="text">
      <button class="btn btn-primary" onclick="buscar()">Buscar</button>
    </div>
  </div></div>

  <!-- Formulario -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3"><div class="col-md-6"><label for="id_producto" class="form-label fw-semibold">ID Producto:</label><input id="id_producto" class="form-control bg-light" readonly></div><div class="col-md-6"><label for="precio" class="form-label fw-semibold">Precio:</label><input id="precio" type="number" class="form-control" min="0" step="0.01"></div><div class="col-md-6"><label for="nombre" class="form-label fw-semibold">Nombre:</label><input id="nombre" type="text" class="form-control"></div><div class="col-md-6"><label for="stock" class="form-label fw-semibold">Stock:</label><input id="stock" type="number" class="form-control" min="0" step="1"></div><div class="col-md-6"><label for="categoria" class="form-label fw-semibold">Categoría:</label><select id="categoria" class="form-select"><option value="">Seleccione...</option><option>Cómputo</option><option>Accesorios</option><option>Oficina</option></select></div><div class="col-md-6"><label for="unidad_medida" class="form-label fw-semibold">Unidad de medida:</label><select id="unidad_medida" class="form-select"><option value="">Seleccione...</option><option>Unidad</option><option>Caja</option><option>Kg</option></select></div><div class="col-md-6"><label for="marca" class="form-label fw-semibold">Marca:</label><input id="marca" type="text" class="form-control"></div><div class="col-md-6"><label for="estado" class="form-label fw-semibold">Estado:</label><select id="estado" class="form-select"><option value="">Seleccione...</option><option>Activo</option><option>Inactivo</option></select></div><div class="col-12"><label for="descripcion" class="form-label fw-semibold">Descripción:</label><textarea id="descripcion" class="form-control" rows="3"></textarea></div></div>
      <div class="mt-4 d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" onclick="registrar()">Registrar</button>
        <button class="btn btn-primary" onclick="modificar()">Modificar</button>
        <button class="btn btn-danger" onclick="eliminar()">Eliminar</button>
        <button class="btn btn-secondary" onclick="limpiar()">Limpiar</button>
      </div>
    </div>
  </div>

  <!-- Tabla de registros -->
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark"><tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CAMPOS = [{"k": "id_producto", "l": "ID Producto", "t": "auto", "r": false}, {"k": "precio", "l": "Precio", "t": "number", "r": true}, {"k": "nombre", "l": "Nombre", "t": "text", "r": true}, {"k": "stock", "l": "Stock", "t": "number", "r": true}, {"k": "categoria", "l": "Categoría", "t": "select", "r": true}, {"k": "unidad_medida", "l": "Unidad de medida", "t": "select", "r": true}, {"k": "marca", "l": "Marca", "t": "text", "r": true}, {"k": "estado", "l": "Estado", "t": "select", "r": true}, {"k": "descripcion", "l": "Descripción", "t": "textarea", "r": false}];
const COLUMNAS = [{"k": "id_producto", "l": "ID"}, {"k": "nombre", "l": "Nombre"}, {"k": "categoria", "l": "Categoría"}, {"k": "precio", "l": "Precio"}, {"k": "stock", "l": "Stock"}, {"k": "estado", "l": "Estado"}];
const AUTO = "id_producto";
let datos = [{"id_producto": 1, "nombre": "Laptop HP 15", "categoria": "Cómputo", "precio": "2500.00", "stock": 10, "estado": "Activo", "marca": "Genérica", "unidad_medida": "Unidad", "descripcion": "", "_id": 1}, {"id_producto": 2, "nombre": "Mouse Logitech", "categoria": "Accesorios", "precio": "45.00", "stock": 50, "estado": "Activo", "marca": "Genérica", "unidad_medida": "Unidad", "descripcion": "", "_id": 2}, {"id_producto": 3, "nombre": "Teclado Redragon", "categoria": "Accesorios", "precio": "120.00", "stock": 0, "estado": "Inactivo", "marca": "Genérica", "unidad_medida": "Unidad", "descripcion": "", "_id": 3}];
let seleccionado = null;
let vista = datos;
let siguiente = datos.reduce((m, d) => Math.max(m, d._id), 0) + 1;

const $ = id => document.getElementById(id);
const hoy = () => new Date().toISOString().slice(0, 10);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function calcular(){}
function validarExtra(d){
  if (Number(d.precio) <= 0) return 'El precio debe ser mayor a 0.';
  return '';
}

function mensaje(texto, tipo) {
  $('mensajes').innerHTML =
    '<div class="alert alert-' + tipo + ' alert-dismissible fade show" role="alert">' + esc(texto) +
    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
}

function valorInicial(c) {
  if (c.t === 'auto') return 'Automático';
  if (c.d === 'HOY') return hoy();
  return c.d !== undefined ? c.d : '';
}

function pintarTabla(lista) {
  vista = lista;
  const tb = $('tbody');
  if (lista.length === 0) {
    tb.innerHTML = '<tr><td colspan="' + COLUMNAS.length + '" class="text-center text-muted">No se encontraron registros</td></tr>';
    return;
  }
  tb.innerHTML = lista.map(d =>
    '<tr style="cursor:pointer" class="' + (d._id === seleccionado ? 'table-primary' : '') + '" onclick="cargar(' + d._id + ')">' +
    COLUMNAS.map(c => '<td>' + esc(d[c.k] === undefined ? '' : d[c.k]) + '</td>').join('') + '</tr>'
  ).join('');
}

function limpiar() {
  seleccionado = null;
  CAMPOS.forEach(c => { $(c.k).value = valorInicial(c); });
  $('txtBuscar').value = '';
  calcular();
  pintarTabla(datos);
}

function leerFormulario() {
  const d = {};
  CAMPOS.forEach(c => { if (c.t !== 'auto') d[c.k] = $(c.k).value.trim(); });
  CAMPOS.filter(c => c.h).forEach(c => { d[c.k] = hoy(); });
  return d;
}

function validar(d) {
  for (const c of CAMPOS) {
    if (c.t === 'auto' || !c.r) continue;
    if (d[c.k] === '') return 'Complete el campo "' + c.l + '".';
    if (c.p && !new RegExp(c.p).test(d[c.k])) return c.m;
    if (c.t === 'number' && Number(d[c.k]) < 0) return 'El campo "' + c.l + '" no puede ser negativo.';
  }
  return validarExtra(d);
}

function registrar() {
  const d = leerFormulario();
  const error = validar(d);
  if (error) { mensaje(error, 'danger'); return; }
  d._id = siguiente++;
  if (AUTO) d[AUTO] = d._id;
  datos.push(d);
  limpiar();
  mensaje('Registro agregado correctamente.', 'success');
}

function modificar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  const d = leerFormulario();
  const error = validar(d);
  if (error) { mensaje(error, 'danger'); return; }
  d._id = seleccionado;
  if (AUTO) d[AUTO] = seleccionado;
  datos = datos.map(x => x._id === seleccionado ? d : x);
  limpiar();
  mensaje('Registro modificado correctamente.', 'success');
}

function eliminar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  if (!confirm('¿Seguro que desea eliminar este registro?')) return;
  datos = datos.filter(x => x._id !== seleccionado);
  limpiar();
  mensaje('Registro eliminado correctamente.', 'success');
}

function buscar() {
  const t = $('txtBuscar').value.trim().toLowerCase();
  const res = datos.filter(d => COLUMNAS.some(c => String(d[c.k] === undefined ? '' : d[c.k]).toLowerCase().includes(t)));
  pintarTabla(res);
  if (res.length === 0) mensaje('No se encontraron resultados.', 'info');
}

function cargar(id) {
  const d = datos.find(x => x._id === id);
  if (!d) return;
  seleccionado = id;
  CAMPOS.forEach(c => {
    $(c.k).value = c.t === 'auto' ? d._id : (d[c.k] === undefined ? '' : d[c.k]);
  });
  calcular();
  pintarTabla(vista);
}

document.addEventListener('DOMContentLoaded', () => {
  CAMPOS.forEach(c => {
    $(c.k).addEventListener('input', calcular);
    $(c.k).addEventListener('change', calcular);
  });
  $('txtBuscar').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
  limpiar();
});
</script>
</body>
</html>
