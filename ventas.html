<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Ventas - Gestión de Ventas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><span class="navbar-brand mb-0">Sistema de Ventas - Gestión de Ventas</span></div>
</nav>
<div class="container my-4">
  <div id="mensajes"></div>

  <!-- Búsqueda -->
  <div class="card shadow-sm mb-4"><div class="card-body">
    <div class="input-group">
      <span class="input-group-text">Buscar por ID de venta o cliente:</span>
      <input id="txtBuscar" class="form-control" type="text">
      <button class="btn btn-primary" onclick="buscar()">Buscar</button>
    </div>
  </div></div>

  <!-- Formulario -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3"><div class="col-md-6"><label for="id_venta" class="form-label fw-semibold">ID Venta:</label><input id="id_venta" class="form-control bg-light" readonly></div><div class="col-md-6"><label for="igv" class="form-label fw-semibold">IGV (18%):</label><input id="igv" class="form-control bg-light" readonly></div><div class="col-md-6"><label for="id_cliente" class="form-label fw-semibold">Cliente:</label><select id="id_cliente" class="form-select"><option value="">Seleccione...</option><option>Juan Pérez Rojas</option><option>María Torres Díaz</option><option>Luis Ramos Soto</option></select></div><div class="col-md-6"><label for="total" class="form-label fw-semibold">Total:</label><input id="total" class="form-control bg-light" readonly></div><div class="col-md-6"><label for="fecha_venta" class="form-label fw-semibold">Fecha de venta:</label><input id="fecha_venta" type="date" class="form-control"></div><div class="col-md-6"><label for="metodo_pago" class="form-label fw-semibold">Método de pago:</label><select id="metodo_pago" class="form-select"><option value="">Seleccione...</option><option>Efectivo</option><option>Tarjeta</option><option>Yape</option></select></div><div class="col-md-6"><label for="subtotal" class="form-label fw-semibold">Subtotal:</label><input id="subtotal" type="number" class="form-control" min="0" step="0.01"></div><div class="col-md-6"><label for="estado_venta" class="form-label fw-semibold">Estado de venta:</label><select id="estado_venta" class="form-select"><option value="">Seleccione...</option><option>Pagada</option><option>Pendiente</option><option>Anulada</option></select></div><div class="col-md-6"><label for="usuario_registro" class="form-label fw-semibold">Usuario registro:</label><input id="usuario_registro" class="form-control bg-light" readonly></div></div>
      <div class="mt-4 d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" onclick="registrar()">Registrar</button>
        <button class="btn btn-primary" onclick="modificar()">Modificar</button>
        <button class="btn btn-danger" onclick="eliminar()">Eliminar</button>
        <button class="btn btn-secondary" onclick="limpiar()">Limpiar</button>
      </div>
    </div>
  </div>

  <!-- Tabla de registros -->
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark"><tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Subtotal</th><th>IGV</th><th>Total</th><th>Método de pago</th><th>Estado</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CAMPOS = [{"k": "id_venta", "l": "ID Venta", "t": "auto", "r": false}, {"k": "igv", "l": "IGV (18%)", "t": "calc", "r": false}, {"k": "id_cliente", "l": "Cliente", "t": "select", "r": true}, {"k": "total", "l": "Total", "t": "calc", "r": false}, {"k": "fecha_venta", "l": "Fecha de venta", "t": "date", "r": true, "d": "HOY"}, {"k": "metodo_pago", "l": "Método de pago", "t": "select", "r": true}, {"k": "subtotal", "l": "Subtotal", "t": "number", "r": true}, {"k": "estado_venta", "l": "Estado de venta", "t": "select", "r": true}, {"k": "usuario_registro", "l": "Usuario registro", "t": "fijo", "r": false, "d": "admin"}];
const COLUMNAS = [{"k": "id_venta", "l": "ID"}, {"k": "id_cliente", "l": "Cliente"}, {"k": "fecha_venta", "l": "Fecha"}, {"k": "subtotal", "l": "Subtotal"}, {"k": "igv", "l": "IGV"}, {"k": "total", "l": "Total"}, {"k": "metodo_pago", "l": "Método de pago"}, {"k": "estado_venta", "l": "Estado"}];
const AUTO = "id_venta";
let datos = [{"id_venta": 1, "id_cliente": "Juan Pérez Rojas", "fecha_venta": "2026-10-10", "subtotal": "100.00", "igv": "18.00", "total": "118.00", "metodo_pago": "Efectivo", "estado_venta": "Pagada", "usuario_registro": "admin", "_id": 1}, {"id_venta": 2, "id_cliente": "María Torres Díaz", "fecha_venta": "2026-10-11", "subtotal": "200.00", "igv": "36.00", "total": "236.00", "metodo_pago": "Yape", "estado_venta": "Pagada", "usuario_registro": "admin", "_id": 2}, {"id_venta": 3, "id_cliente": "Luis Ramos Soto", "fecha_venta": "2026-10-12", "subtotal": "50.00", "igv": "9.00", "total": "59.00", "metodo_pago": "Tarjeta", "estado_venta": "Pendiente", "usuario_registro": "admin", "_id": 3}];
let seleccionado = null;
let vista = datos;
let siguiente = datos.reduce((m, d) => Math.max(m, d._id), 0) + 1;

const $ = id => document.getElementById(id);
const hoy = () => new Date().toISOString().slice(0, 10);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function calcular(){
  const s = parseFloat($('subtotal').value) || 0;
  $('igv').value = (s * 0.18).toFixed(2);
  $('total').value = (s * 1.18).toFixed(2);
}
function validarExtra(d){
  if (Number(d.subtotal) <= 0) return 'El subtotal debe ser mayor a 0.';
  return '';
}

function mensaje(texto, tipo) {
  $('mensajes').innerHTML =
    '<div class="alert alert-' + tipo + ' alert-dismissible fade show" role="alert">' + esc(texto) +
    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
}

function valorInicial(c) {
  if (c.t === 'auto') return 'Automático';
  if (c.d === 'HOY') return hoy();
  return c.d !== undefined ? c.d : '';
}

function pintarTabla(lista) {
  vista = lista;
  const tb = $('tbody');
  if (lista.length === 0) {
    tb.innerHTML = '<tr><td colspan="' + COLUMNAS.length + '" class="text-center text-muted">No se encontraron registros</td></tr>';
    return;
  }
  tb.innerHTML = lista.map(d =>
    '<tr style="cursor:pointer" class="' + (d._id === seleccionado ? 'table-primary' : '') + '" onclick="cargar(' + d._id + ')">' +
    COLUMNAS.map(c => '<td>' + esc(d[c.k] === undefined ? '' : d[c.k]) + '</td>').join('') + '</tr>'
  ).join('');
}

function limpiar() {
  seleccionado = null;
  CAMPOS.forEach(c => { $(c.k).value = valorInicial(c); });
  $('txtBuscar').value = '';
  calcular();
  pintarTabla(datos);
}

function leerFormulario() {
  const d = {};
  CAMPOS.forEach(c => { if (c.t !== 'auto') d[c.k] = $(c.k).value.trim(); });
  CAMPOS.filter(c => c.h).forEach(c => { d[c.k] = hoy(); });
  return d;
}

function validar(d) {
  for (const c of CAMPOS) {
    if (c.t === 'auto' || !c.r) continue;
    if (d[c.k] === '') return 'Complete el campo "' + c.l + '".';
    if (c.p && !new RegExp(c.p).test(d[c.k])) return c.m;
    if (c.t === 'number' && Number(d[c.k]) < 0) return 'El campo "' + c.l + '" no puede ser negativo.';
  }
  return validarExtra(d);
}

function registrar() {
  const d = leerFormulario();
  const error = validar(d);
  if (error) { mensaje(error, 'danger'); return; }
  d._id = siguiente++;
  if (AUTO) d[AUTO] = d._id;
  datos.push(d);
  limpiar();
  mensaje('Registro agregado correctamente.', 'success');
}

function modificar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  const d = leerFormulario();
  const error = validar(d);
  if (error) { mensaje(error, 'danger'); return; }
  d._id = seleccionado;
  if (AUTO) d[AUTO] = seleccionado;
  datos = datos.map(x => x._id === seleccionado ? d : x);
  limpiar();
  mensaje('Registro modificado correctamente.', 'success');
}

function eliminar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  if (!confirm('¿Seguro que desea eliminar este registro?')) return;
  datos = datos.filter(x => x._id !== seleccionado);
  limpiar();
  mensaje('Registro eliminado correctamente.', 'success');
}

function buscar() {
  const t = $('txtBuscar').value.trim().toLowerCase();
  const res = datos.filter(d => COLUMNAS.some(c => String(d[c.k] === undefined ? '' : d[c.k]).toLowerCase().includes(t)));
  pintarTabla(res);
  if (res.length === 0) mensaje('No se encontraron resultados.', 'info');
}

function cargar(id) {
  const d = datos.find(x => x._id === id);
  if (!d) return;
  seleccionado = id;
  CAMPOS.forEach(c => {
    $(c.k).value = c.t === 'auto' ? d._id : (d[c.k] === undefined ? '' : d[c.k]);
  });
  calcular();
  pintarTabla(vista);
}

document.addEventListener('DOMContentLoaded', () => {
  CAMPOS.forEach(c => {
    $(c.k).addEventListener('input', calcular);
    $(c.k).addEventListener('change', calcular);
  });
  $('txtBuscar').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
  limpiar();
});
</script>
</body>
</html>
